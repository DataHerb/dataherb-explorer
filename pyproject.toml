[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataherb-explorer"
version = "0.1.0"
description = "Build a static, forkable data catalog and explorer from a YAML config."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Lei Ma", email = "hi@leima.is" }]
requires-python = ">=3.9"
dependencies = ["pyyaml>=6", "jsonschema>=4.18"]

[project.optional-dependencies]
s3 = ["boto3>=1.28"]
infer = ["duckdb>=1.0"]
dev = ["pytest>=7"]

[project.scripts]
dhx = "dhx.cli:main"

[project.urls]
Homepage = "https://github.com/DataHerb/dataherb-explorer"

[tool.setuptools]
packages = ["dhx"]

[tool.setuptools.package-data]
dhx = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
