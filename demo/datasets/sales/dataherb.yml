spec: dataherb/v2
id: demo-daily-sales
name: Daily sales by region
description: Units sold and revenue per day, region and product for 2025. Produced by the nightly sales-export job. Demo data generated by scripts/make_demo_data.py.
documentation: |
  Each row is one product in one region on one day. Revenue is in EUR, after
  discounts and before tax. Late corrections are applied in the next nightly run.
owner:
  team: Commercial Analytics
  email: commercial-analytics@example.com
tags: [sales, finance, demo]
domain: finance
license: Internal use only
classification: internal
update_frequency: daily
status_job: sales-export
temporal_coverage: { start: "2025-01-01", end: "2025-12-31" }
related:
  - id: demo-regions
    on: daily_sales.region_code = regions.region_code
datapackage:
  resources:
    - name: daily_sales
      path: daily_sales.csv
      format: csv
      schema:
        primaryKey: [date, region_code, product]
        fields:
          - { name: date, type: date, description: Calendar day (UTC) }
          - { name: region_code, type: string, description: "Region, see demo-regions" }
          - { name: product, type: string, description: Product slug }
          - { name: units, type: integer, description: Units sold }
          - { name: revenue_eur, type: number, unit: EUR, description: Net revenue }
