name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Validate config and catalog entries
        run: uv run dataherb catalog validate
      - name: Catalog quality report
        run: uv run dataherb catalog lint
      - name: Syntax-check the site's JavaScript
        run: for f in $(find site/assets -name '*.js'); do node --check "$f"; done
      - name: Build the site
        run: uv run dataherb catalog build
      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: dist
          retention-days: 5
